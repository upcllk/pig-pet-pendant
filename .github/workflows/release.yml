name: Release Windows and macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check and publish Windows EXE
        shell: pwsh
        run: .\windows\scripts\build.ps1 -Test -Publish
      - name: Stage Windows asset
        shell: pwsh
        run: |
          $version = (Get-Item dist/PigPendant-Windows-win-x64.exe).VersionInfo.FileVersion
          if (-not $version.StartsWith("$($env:GITHUB_REF_NAME.Substring(1)).")) { throw "Windows version $version does not match tag $env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item -LiteralPath dist/PigPendant-Windows-win-x64.exe -Destination "dist/release/PigPendant-Windows-win-x64-$env:GITHUB_REF_NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify macOS packages
        run: |
          test "$(uname -m)" = arm64
          ./build.sh
          swift run --scratch-path "$PWD/dist/swiftpm" -c release -Xswiftc -enable-testing PigPendantCoreChecks
      - name: Stage macOS assets
        run: |
          test "$(plutil -extract CFBundleShortVersionString raw -o - dist/PigPendant.app/Contents/Info.plist)" = "${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          cp "dist/PigPendant-macOS-$(uname -m).dmg" "dist/release/PigPendant-macOS-$(uname -m)-${GITHUB_REF_NAME}.dmg"
          cp "dist/PigPendant-macOS-$(uname -m).zip" "dist/release/PigPendant-macOS-$(uname -m)-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify assets and checksums
        run: |
          test -s "dist/release/PigPendant-Windows-win-x64-${GITHUB_REF_NAME}.exe"
          test -s "dist/release/PigPendant-macOS-arm64-${GITHUB_REF_NAME}.dmg"
          test -s "dist/release/PigPendant-macOS-arm64-${GITHUB_REF_NAME}.zip"
          cd dist/release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" --title "Pig Pendant $GITHUB_REF_NAME" --generate-notes --verify-tag
